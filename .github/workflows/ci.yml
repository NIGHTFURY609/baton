name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: hooks must run there without bash (ADR 0008).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:skills
      - run: npm run smoke:hooks
      - name: Smoke-test the CLI and a hook
        shell: bash
        run: |
          node dist/baton.mjs --help
          echo '{"hook_event_name":"SessionStart","source":"startup"}' | node dist/baton.mjs hook session-start
